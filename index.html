// ══════════════════════════════════════════════════
//  GOOGLE APPS SCRIPT  SYNC
//  Works from any browser, any URL, no CORS issues.
//  Data stored in Google Sheets — visible to all users.
//  Polling every 8 seconds keeps all devices in sync.
// ══════════════════════════════════════════════════
async function gasRead(){
  const r = await fetch(GAS_URL, {method:'GET', cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt = await r.text();
  return JSON.parse(txt||'{}');
}

async function gasWrite(data){
  // Apps Script doPost via no-cors — we use a form POST
  await fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data),
    mode:'no-cors'  // no-cors: response is opaque but write still succeeds
  });
}

async function pullData(){
  try{
    const d = await gasRead();
    if(d && typeof d==='object' && Object.keys(d).length>0){
      S.units    = d.units    || S.units;
      S.bookings = d.bookings || {};
      S.issues   = d.issues   || {};
      S.users    = d.users    || S.users;
    } else if(!Object.keys(S.units).length){
      // First run — push seed data
      S.units = {...SEED_UNITS};
      await pushData();
    }
    saveLS();
    _lastPull = Date.now();
    return true;
  }catch(e){
    console.warn('Pull failed:', e.message);
    return false;
  }
}

async function pushData(){
  if(LOCAL_MODE) return;
  const data = {units:S.units,bookings:S.bookings,issues:S.issues,users:S.users};
  showSyncBar(true);
  try{
    await gasWrite(data);
    showSyncBar(false);
    saveLS();
  }catch(e){
    showSyncBar(false);
    console.warn('Push failed:', e.message);
    // queue for retry
    _dirtyQueue.push(data);
  }
}

function startPolling(){
  if(_polling) clearInterval(_polling);
  _polling = setInterval(async ()=>{
    if(LOCAL_MODE) return;
    // Auth removed — no login screen guard needed
    // Never re-render while user is actively typing in any field
    const a = document.activeElement;
    if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.tagName==='SELECT')) return;
    const snapBefore = JSON.stringify(S.units)+JSON.stringify(S.bookings)+JSON.stringify(S.issues)+JSON.stringify(S.users);
    const ok = await pullData();
    if(!ok) return;
    // Only re-render if data actually changed
    const snapAfter = JSON.stringify(S.units)+JSON.stringify(S.bookings)+JSON.stringify(S.issues)+JSON.stringify(S.users);
    if(snapAfter !== snapBefore) render();
    // flush queued writes
    if(_dirtyQueue.length>0){
      const latest = _dirtyQueue[_dirtyQueue.length-1];
      _dirtyQueue = [];
      await gasWrite(latest);
    }
  }, 8000);
}

function showSyncBar(show){
  const el=document.getElementById('syncbar');
  if(el){ el.classList.toggle('show',show); }
}

function saveLS(){
  try{ localStorage.setItem(LS, JSON.stringify({units:S.units,bookings:S.bookings,issues:S.issues,users:S.users})); }catch(e){}
}
function loadLS(){
  try{
    const r=localStorage.getItem(LS);
    if(r){ const d=JSON.parse(r); S.units=d.units||{}; S.bookings=d.bookings||{}; S.issues=d.issues||{}; S.users=d.users||{}; }
  }catch(e){}
}
function saveSession(){ try{localStorage.setItem(LS+'_me',S.currentUser?JSON.stringify(S.currentUser):'');}catch(e){} }
function loadSession(){
  try{
    const u=localStorage.getItem(LS+'_me');
    if(u){
      const p=JSON.parse(u);
      if(p&&p.id){
        // Always use live data from server — never stale local copy
        const live=S.users[p.id];
        if(live) S.currentUser=live;
        // If user not found in live data, stay logged out (force re-login)
        else S.currentUser=null;
      }
    }
  }catch(e){}
}
function saveConfig(url){ try{localStorage.setItem(LS+'_url',url);}catch(e){} }
function loadConfig(){ try{return localStorage.getItem(LS+'_url')||'';}catch(e){return '';} }

//  DATA WRITE  (update local + push to cloud)
// ══════════════════════════════════════════════════
function deepSet(path,val){
  const parts=path.split('/').filter(Boolean);
  const last=parts.pop();
  let obj=S;
  for(const p of parts){ if(obj[p]==null)obj[p]={}; obj=obj[p]; }
  if(val===null) delete obj[last]; else obj[last]=val;
}

async function dbSet(path,val){
  deepSet(path,val);
  saveLS();
  render();
  await pushData();
}
async function dbDel(path){
  deepSet(path,null);
  saveLS();
  render();
  await pushData();
}

function copyGasCode(){
  const code = document.getElementById('gas-code').textContent;
  navigator.clipboard?.writeText(code).then(()=>toast('Code copied ✓')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Code copied ✓');
  });
}

async function connectGAS(){
  const url=(document.getElementById('gas-url')?.value||'').trim();
  const errEl=document.getElementById('setup-err');
  const btn=document.getElementById('connect-btn');
  errEl.style.display='none';
  if(!url||!url.includes('script.google.com')){
    errEl.textContent='Please paste the Web app URL from Google Apps Script (starts with https://script.google.com)';
    errEl.style.display='block'; return;
  }
  btn.textContent='Testing connection…'; btn.disabled=true;
  try{
    // Test read
    const r = await fetch(url+'?test=1', {method:'GET', cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    // Save and launch
    GAS_URL = url;
    saveConfig(url);
    document.getElementById('setup').style.display='none';
    document.getElementById('loading').style.display='flex';
    document.getElementById('ldmsg').textContent='Loading data…';
    await pullData();
    if(!Object.keys(S.units).length){ S.units={...SEED_UNITS}; await pushData(); }
    startPolling();
    hideLoading();
    loadSession();
    render();
  }catch(e){
    errEl.innerHTML=`<strong>Connection failed:</strong> ${e.message}<br><br>Make sure you:<br>• Copied the Web App URL (not the script URL)<br>• Set "Who has access" to <strong>Anyone</strong><br>• Clicked <strong>Deploy</strong> (not just Save)`;
    errEl.style.display='block';
    btn.textContent='CONNECT & LAUNCH →'; btn.disabled=false;
  }
}

function useLocal(){
  LOCAL_MODE=true;
  document.getElementById('setup').style.display='none';
  document.getElementById('loading').style.display='flex';
  loadLS();
  if(!Object.keys(S.units).length){ S.units={...SEED_UNITS}; saveLS(); }
  hideLoading();
  loadSession();
  render();
  toast('Running in local-only mode');
}

function rAuth(){
  const isL=S.authTab==='login';
  document.getElementById('app').innerHTML=`

    <div style="text-align:center"><div style="font-size:52px">⚙️</div>
      <div style="font-family:var(--S);font-size:34px;font-weight:800;color:#fff;letter-spacing:-1px">EquipBook</div>

    </div>
    <div class="acard">
      <div class="atab">
        <button class="${isL?'active':''}" onclick="S.authTab='login';rAuth()">Sign In</button>
        <button class="${!isL?'active':''}" onclick="S.authTab='register';rAuth()">Register</button>
      </div>
      <div id="aerr" style="display:none;background:#fce4ec;color:#b71c1c;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px"></div>
      ${isL?`
        <div class="fld" style="margin-bottom:11px"><label>SA Water Email</label><input id="l-em" type="email" placeholder="firstname.lastname@sawater.com.au" autocomplete="email"/></div>
        <div class="fld"><label>Password</label><input id="l-pw" type="password" placeholder="••••••••"/></div>
        <button class="btn-p" style="margin-top:18px" onclick="doLogin()">SIGN IN</button>`:`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
          <div class="fld"><label>First Name</label><input id="r-fn" placeholder="First"/></div>
          <div class="fld"><label>Last Name</label><input id="r-ln" placeholder="Last"/></div>
        </div>
        <div class="fld" style="margin-bottom:10px"><label>SA Water Email</label><input id="r-em" type="email" placeholder="firstname.lastname@sawater.com.au"/></div>
        <div class="fld" style="margin-bottom:10px"><label>Phone</label><input id="r-ph" type="tel" placeholder="04XX XXX XXX"/></div>
        <div class="fld" style="margin-bottom:10px"><label>Position</label><select id="r-pos"><option value="">Select...</option>${POSITIONS.map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div class="fld"><label>Password</label><input id="r-pw" type="password" placeholder="Min 6 characters"/></div>
        <button class="btn-p" style="margin-top:18px" onclick="doReg()">CREATE ACCOUNT</button>`}

  </div>`;
}
const aErr=m=>{const el=document.getElementById('aerr');el.textContent='⚠ '+m;el.style.display='block';};
function doLogin(){
  const em=gv('l-em').toLowerCase(),pw=gv('l-pw');
  if(!em||!pw)return aErr('Please fill in all fields.');
  const u=Object.values(S.users).find(u=>u.email===em&&u.pw===pw);
  if(!u)return aErr('Incorrect email or password.');
  S.currentUser=u;saveSession();render();
}
function doReg(){
  const fn2=gv('r-fn'),ln=gv('r-ln'),em=gv('r-em').toLowerCase(),ph=gv('r-ph'),pos=gv('r-pos'),pw=gv('r-pw');
  if(!fn2||!ln||!em||!ph||!pos||!pw)return aErr('Please fill in all fields.');
  if(!em.endsWith('@sawater.com.au'))return aErr('Must use your @sawater.com.au email.');
  if(pw.length<6)return aErr('Password must be at least 6 characters.');
  if(Object.values(S.users).find(u=>u.email===em))return aErr('Account already exists for this email.');
  const id=nid();
  const user={id,firstName:fn2,lastName:ln,email:em,phone:ph,position:pos,pw,createdAt:new Date().toISOString()};
  dbSet(`users/${id}`,user).then(()=>{S.currentUser=user;saveSession();render();toast(`Welcome, ${fn2}!`);});
}
function doLogout(){render();} // auth removed

let _qrStream=null,_qrTimer=null;
function openQRScanner(){
  openSh(`<div class="ov" onclick="closeSh(event)"><div class="sh">
    <div class="sh-han"></div>
    <div class="sh-hdr"><div class="sh-ttl">Scan QR Code</div><button class="btn-x" onclick="stopQR();closeSh()">×</button></div>
    <div class="sh-bd">
      <div id="qr-wrap" style="position:relative;background:#000;border-radius:14px;overflow:hidden;width:100%;aspect-ratio:1/1;margin-bottom:14px">
        <video id="qr-vid" style="width:100%;height:100%;object-fit:cover;display:block" playsinline autoplay muted></video>
        <canvas id="qr-cv" style="display:none"></canvas>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
          <div style="width:55%;height:55%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)"></div>
        </div>
      </div>
      <div id="qr-msg" style="text-align:center;font-size:13px;color:var(--mut);padding:4px 0 8px">Point camera at the QR code on the equipment</div>
    </div>
  </div></div>`);
  setTimeout(startQR,200);
}
async function startQR(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    _qrStream=stream;
    const vid=document.getElementById('qr-vid');
    if(!vid){stopQR();return;}
    vid.srcObject=stream;
    await vid.play();
    _qrTimer=setInterval(scanQRFrame,300);
  }catch(e){
    const m=document.getElementById('qr-msg');
    if(m)m.innerHTML='<span style="color:var(--r2)">Camera access denied.<br>Allow camera permission and try again.</span>';
  }
}
function stopQR(){
  if(_qrTimer){clearInterval(_qrTimer);_qrTimer=null;}
  if(_qrStream){_qrStream.getTracks().forEach(t=>t.stop());_qrStream=null;}
}
function scanQRFrame(){
  const vid=document.getElementById('qr-vid'),cv=document.getElementById('qr-cv');
  if(!vid||!cv||vid.readyState<2)return;
  cv.width=vid.videoWidth;cv.height=vid.videoHeight;
  const ctx=cv.getContext('2d');ctx.drawImage(vid,0,0);
  if(typeof jsQR==='undefined')return;
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  const code=jsQR(img.data,img.width,img.height);
  if(code){
    const m=code.data.match(/ID:([A-Z]+-[A-Z]+-\d+)/);
    if(m&&S.units[m[1]]){stopQR();closeSh();openUnit(m[1]);toast('Found: '+m[1]);return;}
    const msg=document.getElementById('qr-msg');
    if(msg)msg.textContent='Scanned: '+code.data.slice(0,50);
  }
}

function _qrVerifyStep(expectedUid,title,subtitle,onOk){
  openSh(`<div class="ov" onclick="event.stopPropagation()"><div class="sh">
    <div class="sh-han"></div>
    <div class="sh-hdr"><div class="sh-ttl">${title}</div><button class="btn-x" onclick="stopQR();closeSh()">×</button></div>
    <div class="sh-bd">
      <div style="background:#e3f2fd;border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;color:#0d47a1;font-weight:600">${subtitle}</div>
      <div id="qr-wrap" style="position:relative;background:#000;border-radius:14px;overflow:hidden;width:100%;aspect-ratio:1/1;margin-bottom:12px">
        <video id="qr-vid" style="width:100%;height:100%;object-fit:cover;display:block" playsinline autoplay muted></video>
        <canvas id="qr-cv" style="display:none"></canvas>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
          <div style="width:55%;height:55%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)"></div>
        </div>
      </div>
      <div id="qr-msg" style="text-align:center;font-size:13px;color:var(--mut);padding:4px 0 8px">Point camera at the QR code on the equipment</div>
    </div>
  </div></div>`);
  setTimeout(async ()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      _qrStream=stream;
      const vid=document.getElementById('qr-vid');if(!vid){stopQR();return;}
      vid.srcObject=stream;await vid.play();
      _qrTimer=setInterval(()=>{
        const vid2=document.getElementById('qr-vid'),cv=document.getElementById('qr-cv');
        if(!vid2||!cv||vid2.readyState<2)return;
        cv.width=vid2.videoWidth;cv.height=vid2.videoHeight;
        const ctx=cv.getContext('2d');ctx.drawImage(vid2,0,0);
        if(typeof jsQR==='undefined')return;
        const img=ctx.getImageData(0,0,cv.width,cv.height);
        const code=jsQR(img.data,img.width,img.height);
        if(!code)return;
        const m=code.data.match(/ID:([A-Z]+-[A-Z]+-\d+)/);
        const msg=document.getElementById('qr-msg');
        if(m&&m[1]===expectedUid){
          stopQR();
          if(msg){msg.style.color='var(--g2)';msg.textContent='✓ Verified! Opening camera…';}
          setTimeout(onOk,600);
        } else if(msg){
          msg.style.color='var(--r2)';
          msg.textContent=m?'Wrong instrument ('+m[1]+') — please scan '+expectedUid:'Unrecognised QR code, try again';
        }
      },300);
    }catch(e){
      const m=document.getElementById('qr-msg');
      const wrap=document.getElementById('qr-wrap');
      if(wrap)wrap.style.display='none';
      const insecure=!window.isSecureContext||location.protocol==='file:';
      const msg=insecure
        ?'Camera blocked: open this app via <strong>https://</strong> or allow file access in browser settings.'
        :e.name==='NotAllowedError'||e.name==='PermissionDeniedError'
          ?'Camera permission denied — tap the 🔒 icon in the address bar and allow camera, then try again.'
          :e.name==='NotFoundError'
            ?'No camera found on this device.'
            :'Camera unavailable ('+e.name+').';
      if(m)m.innerHTML=`<div style="color:var(--r2);font-size:12px;line-height:1.6;margin-bottom:12px">${msg}</div>`
        +`<button class="btn-s" onclick="stopQR();(window._qrSkipCb&&window._qrSkipCb())">Skip QR — proceed anyway</button>`;
      window._qrSkipCb=onOk;
    }
  },200);
}

function _photoStep(title,subtitle,onDone){
  pushSh(`<div class="ov" onclick="event.stopPropagation()"><div class="sh">
    <div class="sh-han"></div>
    <div class="sh-hdr"><div class="sh-ttl">${title}</div><button class="btn-x" onclick="_stopCam();popSh()">×</button></div>
    <div class="sh-bd">

      <div id="cam-btns"><button class="btn-p" onclick="_capSnap()">📷 CAPTURE PHOTO</button><button class="btn-s" style="margin-top:8px" onclick="_skipPhoto()">Skip (no photo)</button></div>
      <div id="cam-confirm" style="display:none">
        <button class="btn-ok" onclick="_useSnap()" style="margin-bottom:8px">✓ USE THIS PHOTO</button>
        <button class="btn-s" onclick="_retakeSnap()">↺ Retake</button>
      </div>
    </div>
  </div></div>`);
  window._snapCb=onDone;
  setTimeout(async ()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
      _camStream=stream;
      const vid=document.getElementById('cam-vid');if(!vid){_stopCam();return;}
      vid.srcObject=stream;await vid.play();
    }catch(e){
      document.getElementById('cam-live').style.display='none';
      const btns=document.getElementById('cam-btns');
      const insecure=!window.isSecureContext||location.protocol==='file:';
      const msg=insecure
        ?'Camera blocked: open this app via <strong>https://</strong> or allow file access in browser settings.'
        :e.name==='NotAllowedError'||e.name==='PermissionDeniedError'
          ?'Camera permission denied — tap the 🔒 icon in the address bar and allow camera, then retry.'
          :e.name==='NotFoundError'?'No camera found on this device.'
          :'Camera unavailable ('+e.name+').';
      if(btns)btns.innerHTML=`<div style="font-size:12px;color:var(--r2);line-height:1.6;margin-bottom:12px">${msg}</div><button class="btn-s" onclick="_skipPhoto()">Skip (no photo)</button>`;
    }
  },200);
}
function _stopCam(){if(_camStream){_camStream.getTracks().forEach(t=>t.stop());_camStream=null;}}
function _capSnap(){
  const vid=document.getElementById('cam-vid'),cv=document.getElementById('cam-cv');
  if(!vid||!cv)return;
  const scale=Math.min(1,640/vid.videoWidth);
  cv.width=Math.round(vid.videoWidth*scale);cv.height=Math.round(vid.videoHeight*scale);
  cv.getContext('2d').drawImage(vid,0,0,cv.width,cv.height);
  window._snap=cv.toDataURL('image/jpeg',0.72);

function addUser(){
  pushSh(`<div class="ov" onclick="closeSh(event)"><div class="sh">
    <div class="sh-han"></div><div class="sh-hdr"><div class="sh-ttl">Add User</div><button class="btn-x" onclick="popSh()">×</button></div>
    <div class="sh-bd">
      <div class="fg">
        <div class="fld"><label>First Name</label><input id="nu-fn" placeholder="First" oninput="autoUserEmail()"/></div>
        <div class="fld"><label>Last Name</label><input id="nu-ln" placeholder="Last" oninput="autoUserEmail()"/></div>
        <div class="ff fld"><label>Email</label><input id="nu-em" type="email" placeholder="firstname.lastname@sawater.com.au"/></div>
        <div class="ff fld"><label>Position</label><select id="nu-pos">${POSITIONS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      </div>
      <button class="btn-p" onclick="saveAddUser()">ADD USER</button>
    </div>
  </div></div>`);
}
function saveAddUser(){
  const fn2=gv('nu-fn'),ln=gv('nu-ln'),em=gv('nu-em'),pos=gv('nu-pos');
  if(!fn2||!ln)return toast('Name is required','err');
  const users=Object.values(S.users);
  const nameDup=users.find(u=>u.firstName.toLowerCase()===fn2.toLowerCase()&&u.lastName.toLowerCase()===ln.toLowerCase());
  if(nameDup)return toast(`${fn2} ${ln} already exists`,'err');
  const emDup=em&&users.find(u=>u.email&&u.email.toLowerCase()===em.toLowerCase());
  if(emDup)return toast('Email already in use','err');
  const id='usr-'+Date.now();
  const u={id,firstName:fn2,lastName:ln,email:em,position:pos,createdAt:new Date().toISOString()};
  dbSet(`users/${id}`,u).then(()=>{popSh();toast(fn2+' added ✓');});
}
function autoUserEmail(){
  const f=(gv('nu-fn')||'').trim().toLowerCase();
  const l=(gv('nu-ln')||'').trim().toLowerCase();
  const em=document.getElementById('nu-em');
  if(em&&(f||l))em.value=(f&&l)?f+'.'+l+'@sawater.com.au':((f||l)+'@sawater.com.au');
}
function confDelUser(uid){
  if(uid===S.currentUser?.id)return toast('Cannot delete your own account','err');
  const u=gUser(uid);if(!u)return;
  pushSh(`<div class="ov" onclick="closeSh(event)"><div class="sh">
    <div class="sh-han"></div><div class="sh-hdr"><div class="sh-ttl">Delete User</div><button class="btn-x" onclick="popSh()">×</button></div>
    <div class="sh-bd">
      <div style="background:#fce4ec;border-radius:12px;padding:16px;margin-bottom:18px"><div style="font-weight:700;font-size:14px;color:var(--r2);margin-bottom:8px">⚠ Confirm</div><div style="font-size:13px;color:#7f1d1d">Delete account for <strong>${fn(u)}</strong>? Booking history is kept.</div></div>
      <button class="btn-d" onclick="(()=>{delete S.users['${uid}'];saveLS();render();pushData();popSh();toast('User deleted');})()">YES, DELETE</button>
      <button class="btn-s" style="margin-top:9px" onclick="popSh()">Cancel</button>
    </div>
  </div></div>`);
}
function expCal(){
  const rows=[['Unit ID','SN','Brand','Model','Dept','Cat','Location','Station','Last Cal Date','Interval (months)','Due Date','Days Until Due','Status']];
  Object.values(S.units).forEach(u=>{const due=cDue(u.calDate,u.calInterval);const d=due?dTo(due):null;rows.push([u.id,u.sn,u.brand,u.model,u.dept,u.cat,u.location,u.station,u.calDate||'',u.calInterval||'',due||'',d===null?'':d,d===null?'No date':d<0?'OVERDUE':d<=30?'DUE SOON':'OK']);});
  const csv=rows.map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=`EquipBook_CalReport_${today()}.csv`;a.click();toast('Cal report exported ✓');
}
function expIss(){
  const rows=[['Issue ID','Unit ID','SN','Brand','Model','Dept','Type','Severity','Description','Action','Logged By','Date','Status','Resolved By','Resolved Date']];
  Object.values(S.issues).forEach(i=>{const u=gU(i.unitId);rows.push([i.id,u?.id||'',u?.sn||'',u?.brand||'',u?.model||'',u?.dept||'',i.type,i.severity,i.comment,i.action||'',i.loggedBy,i.date,i.status,i.resolvedBy||'',i.resolvedDate||'']);});
  const csv=rows.map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=`EquipBook_Issues_${today()}.csv`;a.click();toast('Issues exported ✓');
}
function confReset(){
  openSh(`<div class="ov" onclick="closeSh(event)"><div class="sh">
    <div class="sh-han"></div><div class="sh-hdr"><div class="sh-ttl">System Reset</div><button class="btn-x" onclick="popSh()">×</button></div>
    <div class="sh-bd">
      <div style="background:#fff3e0;border-radius:12px;padding:16px;margin-bottom:18px"><div style="font-weight:700;font-size:14px;color:var(--a2);margin-bottom:8px">⚠ Confirm Reset</div><div style="font-size:13px;color:#7f3f00;line-height:1.6">This will:<br>• Clear ALL bookings<br>• Clear ALL issue logs<br>• Set ALL units to Available<br><br>User accounts and unit records are kept.</div></div>
      <button class="btn-d" onclick="doReset()">YES, RESET SYSTEM</button>
      <button class="btn-s" style="margin-top:9px" onclick="popSh()">Cancel</button>
    </div>
  </div></div>`);
}
function doReset(){
  S.bookings={};S.issues={};
  Object.values(S.units).forEach(u=>{u.status='Available';});
  saveLS();render();pushData().then(()=>{_stk=[];sw().innerHTML='';toast('System reset ✓');});
}

// ══════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════
(function boot(){
  loadLS();
  if(!Object.keys(S.units).length){ S.units={...SEED_UNITS}; saveLS(); }
  if(!Object.keys(S.users).length){ S.users={...SEED_USERS}; saveLS(); }
  loadSession();
  document.getElementById('ldmsg').textContent='Connecting…';
  setTimeout(async ()=>{
    hideLoading();
    render();
    const ok = await pullData();
    if(ok){
      if(!Object.keys(S.users).length){ S.users={...SEED_USERS}; }
      loadSession(); saveLS(); render();
    }
    startPolling();
  }, 400);
})();
</script>
