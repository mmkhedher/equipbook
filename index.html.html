  'HYD-PL-002':{id:'HYD-PL-002',dept:'Hydraulic',cat:'Pressure Logger',brand:'Inflowmatix',model:'Pressure Logger Pro',sn:'IF-12244',location:'G29',station:'A2',condition:'Good',calDate:'2026-01-15',calInterval:12,status:'Available',notes:'',responsible:'',desc:'Digital pressure data logger. Max 20 bar. IP68.',sop:'1. Charge unit fully.\n2. Pair via Bluetooth.\n3. Set logging interval.\n4. Install on pipe.\n5. Download data before returning.'},
  'HYD-PL-003':{id:'HYD-PL-003',dept:'Hydraulic',cat:'Pressure Logger',brand:'Inflowmatix',model:'Pressure Logger Pro',sn:'IF-12245',location:'G29',station:'A3',condition:'Fair',calDate:'2025-11-01',calInterval:12,status:'Available',notes:'Battery drains faster than normal',responsible:'',desc:'Digital pressure data logger.',sop:'1. Charge unit fully.\n2. Pair via Bluetooth.\n3. Set logging interval.\n4. Install on pipe.\n5. Download data before returning.'},
  'HYD-PL-004':{id:'HYD-PL-004',dept:'Hydraulic',cat:'Pressure Logger',brand:'Inflowmatix',model:'Pressure Logger Pro',sn:'IF-12246',location:'G29',station:'A4',condition:'Good',calDate:'2026-03-10',calInterval:12,status:'Available',notes:'',responsible:'',desc:'Digital pressure data logger.',sop:'1. Charge unit fully.\n2. Pair via Bluetooth.\n3. Set logging interval.\n4. Install on pipe.\n5. Download data before returning.'},
  'HYD-FM-001':{id:'HYD-FM-001',dept:'Hydraulic',cat:'Flow Meter',brand:'Xylem',model:'Magnetic EM 2000',sn:'XY-22100',location:'G29',station:'B1',condition:'Good',calDate:'2026-02-20',calInterval:12,status:'Available',notes:'',responsible:'',desc:'Electromagnetic flow meter for full-pipe measurement.',sop:'1. Verify pipe is fully flowing.\n2. Install electrodes perpendicular to flow.\n3. Zero meter.\n4. Record in L/s or m³/h.'},
  'HYD-FM-002':{id:'HYD-FM-002',dept:'Hydraulic',cat:'Flow Meter',brand:'Xylem',model:'Magnetic EM 2000',sn:'XY-22101',location:'G29',station:'B2',condition:'Poor',calDate:'2025-08-01',calInterval:6,status:'Available',notes:'Sensor readings intermittent',responsible:'',desc:'Electromagnetic flow meter.',sop:'1. Verify pipe is fully flowing.\n2. Install electrodes perpendicular to flow.\n3. Zero meter.\n4. Verify readings are stable.'},
  'HYD-FM-003':{id:'HYD-FM-003',dept:'Hydraulic',cat:'Flow Meter',brand:'IXOM',model:'Ultrasonic Clamp-On',sn:'IX-33050',location:'G29',station:'B3',condition:'Good',calDate:'2026-01-01',calInterval:12,status:'Available',notes:'',responsible:'',desc:'Portable clamp-on ultrasonic flow meter.',sop:'1. Clean pipe surface.\n2. Apply coupling gel.\n3. Clamp transducers per spacing chart.\n4. Select pipe material and wall thickness.'},

  'MCH-TQ-002':{id:'MCH-TQ-002',dept:'Mechanical',cat:'Torque Wrench',brand:'Fluke',model:'Torque Analyser 500',sn:'FL-55011',location:'G29',station:'D2',condition:'Fair',calDate:'2025-10-01',calInterval:12,status:'Available',notes:'Display scratch — functional',responsible:'',desc:'Digital torque wrench analyser.',sop:'1. Select socket size.\n2. Set target torque in Nm.\n3. Apply force slowly.\n4. Audible click at target.\n5. Export data via USB.'},
  'MCH-TQ-003':{id:'MCH-TQ-003',dept:'Mechanical',cat:'Torque Wrench',brand:'Fluke',model:'Torque Analyser 500',sn:'FL-55012',location:'G29',station:'D3',condition:'Good',calDate:'2026-03-20',calInterval:12,status:'Available',notes:'',responsible:'',desc:'Digital torque wrench analyser.',sop:'1. Select socket size.\n2. Set target torque in Nm.\n3. Apply force slowly.\n4. Audible click at target.\n5. Export data via USB.'},

  'MTL-TG-002':{id:'MTL-TG-002',dept:'Material',cat:'Thickness Gauge',brand:'Olympus',model:'38DL Plus UT',sn:'OL-66201',location:'G29',station:'E2',condition:'Good',calDate:'2025-12-01',calInterval:12,status:'Available',notes:'',responsible:'',desc:'Ultrasonic thickness gauge.',sop:'1. Calibrate on reference block.\n2. Apply couplant gel.\n3. Press probe perpendicularly.\n4. Read in mm.\n5. Clean probe after use.'},

// ══════════════════════════════════════════════════
//  GOOGLE APPS SCRIPT  SYNC
//  Works from any browser, any URL, no CORS issues.
//  Data stored in Google Sheets — visible to all users.
//  Polling every 8 seconds keeps all devices in sync.
// ══════════════════════════════════════════════════
async function gasRead(){
  const r = await fetch(GAS_URL, {method:'GET', cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt = await r.text();
  return JSON.parse(txt||'{}');
}

async function gasWrite(data){
  // Apps Script doPost via no-cors — we use a form POST
  await fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data),
    mode:'no-cors'  // no-cors: response is opaque but write still succeeds
  });
}

async function pullData(){
  try{
    const d = await gasRead();
    if(d && typeof d==='object' && Object.keys(d).length>0){
      S.units    = d.units    || S.units;
      S.bookings = d.bookings || {};
      S.issues   = d.issues   || {};
      S.users    = d.users    || S.users;
    } else if(!Object.keys(S.units).length){
      // First run — push seed data
      S.units = {...SEED_UNITS};
      await pushData();
    }
    saveLS();
    _lastPull = Date.now();
    return true;
  }catch(e){
    console.warn('Pull failed:', e.message);
    return false;
  }
}

async function pushData(){
  if(LOCAL_MODE) return;
  const data = {units:S.units,bookings:S.bookings,issues:S.issues,users:S.users};
  showSyncBar(true);
  try{
    await gasWrite(data);
    showSyncBar(false);
    saveLS();
  }catch(e){
    showSyncBar(false);
    console.warn('Push failed:', e.message);
    // queue for retry
    _dirtyQueue.push(data);
  }
}

function startPolling(){
  if(_polling) clearInterval(_polling);
  _polling = setInterval(async ()=>{
    if(LOCAL_MODE) return;
    // Auth removed — no login screen guard needed
    // Never re-render while user is actively typing in any field
    const a = document.activeElement;
    if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.tagName==='SELECT')) return;
    const snapBefore = JSON.stringify(S.units)+JSON.stringify(S.bookings)+JSON.stringify(S.issues)+JSON.stringify(S.users);
    const ok = await pullData();
    if(!ok) return;
    // Only re-render if data actually changed
    const snapAfter = JSON.stringify(S.units)+JSON.stringify(S.bookings)+JSON.stringify(S.issues)+JSON.stringify(S.users);
    if(snapAfter !== snapBefore) render();
    // flush queued writes
    if(_dirtyQueue.length>0){
      const latest = _dirtyQueue[_dirtyQueue.length-1];
      _dirtyQueue = [];
      await gasWrite(latest);
    }
  }, 8000);
}

  try{
    const u=localStorage.getItem(LS+'_me');

      if(p&&p.id){

        const live=S.users[p.id];
        if(live) S.currentUser=live;

        else S.currentUser=null;
      }

}

//  DATA WRITE  (update local + push to cloud)
// ══════════════════════════════════════════════════
function deepSet(path,val){
  const parts=path.split('/').filter(Boolean);
  const last=parts.pop();
  let obj=S;
  for(const p of parts){ if(obj[p]==null)obj[p]={}; obj=obj[p]; }
  if(val===null) delete obj[last]; else obj[last]=val;
}

async function dbSet(path,val){
  deepSet(path,val);
  saveLS();
  render();
  await pushData();
}
async function dbDel(path){
  deepSet(path,null);
  saveLS();
  render();
  await pushData();
}

async function connectGAS(){
  const url=(document.getElementById('gas-url')?.value||'').trim();
  const errEl=document.getElementById('setup-err');
  const btn=document.getElementById('connect-btn');
  errEl.style.display='none';
  if(!url||!url.includes('script.google.com')){
    errEl.textContent='Please paste the Web app URL from Google Apps Script (starts with https://script.google.com)';
    errEl.style.display='block'; return;
  }
  btn.textContent='Testing connection…'; btn.disabled=true;
  try{
    // Test read
    const r = await fetch(url+'?test=1', {method:'GET', cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    // Save and launch
    GAS_URL = url;
    saveConfig(url);
    document.getElementById('setup').style.display='none';
    document.getElementById('loading').style.display='flex';
    document.getElementById('ldmsg').textContent='Loading data…';
    await pullData();
    if(!Object.keys(S.units).length){ S.units={...SEED_UNITS}; await pushData(); }
    startPolling();
    hideLoading();
    loadSession();
    render();
  }catch(e){
    errEl.innerHTML=`<strong>Connection failed:</strong> ${e.message}<br><br>Make sure you:<br>• Copied the Web App URL (not the script URL)<br>• Set "Who has access" to <strong>Anyone</strong><br>• Clicked <strong>Deploy</strong> (not just Save)`;
    errEl.style.display='block';
    btn.textContent='CONNECT & LAUNCH →'; btn.disabled=false;
  }
}

function confirmBk(uid){
  const d=gv('bk-d'),t=gv('bk-t'),r=gv('bk-r'),l=gv('bk-l');
  const err=m=>{const el=document.getElementById('bk-err');el.textContent='⚠ '+m;el.style.display='block';};
  if(!d)return err('Please select a booking date.');
  if(!r)return err('Please select a return date.');
  if(r<d)return err('Return date must be after booking date.');
  if(!l)return err('Deployment location is required.');
  const conflict=Object.values(S.bookings).find(b=>{
    if(b.unitId!==uid||b.status!=='Active')return false;
    const s1=new Date(`${b.bookDate}T${b.bookTime}`),e1=new Date(`${b.returnDate}T23:59`);
    const s2=new Date(`${d}T${t}`),e2=new Date(`${r}T23:59`);
    return!(e2<s1||s2>e1);
  });
  if(conflict){const bu=gUser(conflict.userId);return err(`Conflict with ${bu?fn(bu):'another booking'} (${fD(conflict.bookDate)} → ${fD(conflict.returnDate)}).`);}
  const id='BK-'+Date.now();

  Object.values(S.units).forEach(u=>{const due=cDue(u.calDate,u.calInterval);const d=due?dTo(due):null;rows.push([u.id,u.sn,u.brand,u.model,u.dept,u.cat,u.location,u.station,u.calDate||'',u.calInterval||'',due||'',d===null?'':d,d===null?'No date':d<0?'OVERDUE':d<=30?'DUE SOON':'OK']);});
  const csv=rows.map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=`EquipBook_CalReport_${today()}.csv`;a.click();toast('Cal report exported ✓');
}
function expIss(){
  const rows=[['Issue ID','Unit ID','SN','Brand','Model','Dept','Type','Severity','Description','Action','Logged By','Date','Status','Resolved By','Resolved Date']];
  Object.values(S.issues).forEach(i=>{const u=gU(i.unitId);rows.push([i.id,u?.id||'',u?.sn||'',u?.brand||'',u?.model||'',u?.dept||'',i.type,i.severity,i.comment,i.action||'',i.loggedBy,i.date,i.status,i.resolvedBy||'',i.resolvedDate||'']);});
  const csv=rows.map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=`EquipBook_Issues_${today()}.csv`;a.click();toast('Issues exported ✓');
}
function confReset(){
  openSh(`<div class="ov" onclick="closeSh(event)"><div class="sh">
    <div class="sh-han"></div><div class="sh-hdr"><div class="sh-ttl">System Reset</div><button class="btn-x" onclick="popSh()">×</button></div>
    <div class="sh-bd">
      <div style="background:#fff3e0;border-radius:12px;padding:16px;margin-bottom:18px"><div style="font-weight:700;font-size:14px;color:var(--a2);margin-bottom:8px">⚠ Confirm Reset</div><div style="font-size:13px;color:#7f3f00;line-height:1.6">This will:<br>• Clear ALL bookings<br>• Clear ALL issue logs<br>• Set ALL units to Available<br><br>User accounts and unit records are kept.</div></div>
      <button class="btn-d" onclick="doReset()">YES, RESET SYSTEM</button>
      <button class="btn-s" style="margin-top:9px" onclick="popSh()">Cancel</button>
    </div>
  </div></div>`);
}
function doReset(){
  S.bookings={};S.issues={};
  Object.values(S.units).forEach(u=>{u.status='Available';});
  saveLS();render();pushData().then(()=>{_stk=[];sw().innerHTML='';toast('System reset ✓');});
}

// ══════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════
(function boot(){
  // GAS URL hardcoded — no setup screen needed
  // Auth removed — go straight to app
  loadLS();
  if(!Object.keys(S.units).length){ S.units={...SEED_UNITS}; saveLS(); }
  document.getElementById('ldmsg').textContent='Connecting…';
  setTimeout(async ()=>{
    hideLoading();
    render();
    const ok = await pullData();
    if(ok){ saveLS(); render(); }
    startPolling();
  }, 400);
})();
</script>
